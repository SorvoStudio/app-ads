<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>SorvoStudio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="canonical" href="https://www.sorvostudio.com/" />

  <style>
    /* === 全局样式 === */
    :root {
      --bg-color: #090c12;
      --link: #4EA8DE;
      --link-hover: #74caff;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    /* 背景画布（置底） */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--bg-color);
      touch-action: none;
      /* 移动端防止滚动冲突 */
    }

    /* 主要内容 */
    .container {
      padding: 60px 20px;
      position: relative;
      z-index: 1;
    }

    img.logo {
      width: 180px;
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
    }

    h1 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 700px;
      margin: 0 auto 20px auto;
    }

    a {
      color: var(--link);
      text-decoration: none;
      transition: color .25s ease;
    }

    a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    footer {
      margin-top: 60px;
      font-size: 14px;
      color: #aaa;
    }

    /* 垂直居中（高屏可选） */
    @media (min-height: 700px) {
      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }

    /* 用户偏好：减少动效时降级为静态 */
    @media (prefers-reduced-motion: reduce) {
      #bgCanvas {
        display: none;
      }

      /* 直接关闭动画画布 */
      body {
        background: #0b111a;
      }

      /* 稳定静态色 */
    }
  </style>
</head>

<body>
  <!-- 背景粒子画布 -->
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <!-- 主体内容 -->
  <div class="container">
    <img src="logo.png" alt="SorvoStudio Logo" class="logo" />
    <h1>Welcome to SorvoStudio</h1>
    <p>SorvoStudio is an independent game development studio based in Nanjing, China.</p>
    <p>We create fun, visually striking casual and hyper-casual mobile games for global players.</p>
    <p>Contact us: <a href="mailto:sorvostudio@gmail.com">sorvostudio@gmail.com</a></p>
    <footer>&copy; 2025 SorvoStudio. All rights reserved.</footer>
  </div>

  <!-- 粒子脚本 -->
  <script src="/js/particles.js" defer></script>
</body>

</html>
